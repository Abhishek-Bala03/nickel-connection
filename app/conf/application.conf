; Service settings, read by src.config (the same pattern as Rockwell's conf/application.conf).
; ${VAR} values come from the environment, for example a .env file (see .env.example).
; When a variable is not set, src.config falls back to its built-in default.

[SERVICE]
name = nickel-connection
; development, qa or production. The API docs (/docs, /redoc, /openapi.json) are on in development
; only, where they are open to anyone who can reach the port; unset: production, so they are off.
environment = ${NICKEL_ENV}
cors_origins = ${NICKEL_CORS_ORIGINS}
; The token every caller but the probes must present (Authorization: Bearer <token>): the scheduler
; and the Nickel API layer hold the same one from Vault. The value itself, or a file holding it (a K8s
; secret mount) - one of the two. Never a literal here: this file is in the image. Without a token
; the service does not start (src.services.auth).
token = ${NICKEL_SERVICE_TOKEN}
token_file = ${NICKEL_SERVICE_TOKEN_FILE}

[LOGGING]
level = ${NICKEL_LOG_LEVEL}

[CONNECTOR]
; The tenant this deployment ingests for: a UUID, never a clinic name or a sequence number.
; Provisional: until the platform decides how background jobs get their tenant from the identity
; provider, the deployment sets it here. Unset: the service starts, but pulls are refused.
tenant_id = ${NICKEL_TENANT_ID}
; Largest single payload the ingest bridge accepts, in bytes. Default 104857600 (100 MB).
max_file_bytes = ${NICKEL_MAX_FILE_BYTES}
; Folder of the document source manifests (<id>.yaml). Default: app/manifests/documents.
manifest_dir = ${NICKEL_MANIFEST_DIR}
; Source credentials are not settings: kagglehub reads KAGGLE_API_TOKEN and huggingface_hub reads
; HF_TOKEN from the environment themselves. Nothing in the service reads or logs them.

[STORAGE]
; Root of the development File Store, the raw_data outbox, the receipts and the job records
; (src/db/layout.py). Default .data; the image sets /data.
data_dir = ${NICKEL_DATA_DIR}

[JOBS]
; How many jobs may wait in the queue (the one running is not counted). A POST /jobs/* beyond it is a
; 429 with Retry-After, and the scheduler comes back later (docs/jobs-api.md). Default 100.
max_queued = ${NICKEL_JOBS_MAX_QUEUED}

[FILE_STORE]
; Where the originals go: local (a folder under data_dir) or s3 (an S3 API: SeaweedFS in development,
; the object store the SeaweedFS-vs-RustFS bake-off picks in production; docs/document-ingestion.md,
; "File Store"). Default s3 in production, which refuses local; local in development and qa. The
; settings below are read, and checked at start-up, only for s3.
backend = ${NICKEL_FILE_STORE}
; The S3 API, http(s)://host[:port]. Every address its host resolves to must be loopback, private or
; on the tailnet (100.64.0.0/10; src/utility/endpoints.py): the originals stay inside the platform.
; In production, plain http is taken to loopback only (a private CA: s3_ca_bundle below).
s3_endpoint_url = ${NICKEL_S3_ENDPOINT_URL}
; true lifts the address rule for an https endpoint (the service logs it). Default false.
s3_allow_public_endpoint = ${NICKEL_S3_ALLOW_PUBLIC_ENDPOINT}
; Part of the request signature (SeaweedFS takes any). Default us-east-1.
s3_region = ${NICKEL_S3_REGION}
; The bucket of the originals; each key is <tenant>/<class>/<sha256[:2]>/<sha256>. Default originals.
s3_originals_bucket = ${NICKEL_S3_ORIGINALS_BUCKET}
; The credentials, from the settings only (never ~/.aws or AWS_* variables): each the value, or a file
; holding it (a Vault or K8s secret mount), one of the two. Never a literal here: this file is in the
; image.
s3_access_key_id = ${NICKEL_S3_ACCESS_KEY_ID}
s3_access_key_id_file = ${NICKEL_S3_ACCESS_KEY_ID_FILE}
s3_secret_access_key = ${NICKEL_S3_SECRET_ACCESS_KEY}
s3_secret_access_key_file = ${NICKEL_S3_SECRET_ACCESS_KEY_FILE}
; A PEM bundle for an https endpoint behind a private CA. Default: the bundled public CAs.
s3_ca_bundle = ${NICKEL_S3_CA_BUNDLE}
; The most one call to the store may take, retries included, in seconds: past it the job fails
; instead of waiting on a store that has stopped answering. Default 300 (a 100 MB original at 1 MB/s,
; with room for retries); raise it with max_file_bytes.
s3_call_deadline_seconds = ${NICKEL_S3_CALL_DEADLINE_SECONDS}

[KAFKA]
; Development demo only. Empty keeps the existing JSONL outbox.
bootstrap_servers = ${NICKEL_KAFKA_BOOTSTRAP_SERVERS}

[NANGO]
; Nango's API (auth + proxy only; decision 2), e.g. http://nango-server:3003. Unset: Nango connectors
; are off (docs/demo-nango-wearables.md).
url = ${NICKEL_NANGO_URL}
; The Nango environment's secret key: the value or a mounted file, one of the two. Never a literal here.
secret_key = ${NICKEL_NANGO_SECRET_KEY}
secret_key_file = ${NICKEL_NANGO_SECRET_KEY_FILE}
; Development only: provider=base-url pairs Nango's proxy is pointed at instead of the vendor
; (the vendor simulator), comma-separated. Refused in qa and production.
base_url_overrides = ${NICKEL_NANGO_BASE_URL_OVERRIDES}
