; Service settings, read by src.config (the same pattern as Rockwell's conf/application.conf).
; ${VAR} values come from the environment, for example a .env file (see .env.example).
; When a variable is not set, src.config falls back to its built-in default.

[SERVICE]
name = nickel-connection
environment = ${NICKEL_ENV}
cors_origins = ${NICKEL_CORS_ORIGINS}

[LOGGING]
level = ${NICKEL_LOG_LEVEL}

[CONNECTOR]
; The tenant this deployment ingests for: a UUID, never a clinic name or a sequence number.
; Provisional: until the platform decides how background jobs get their tenant from the identity
; provider, the deployment sets it here. Unset: the service starts, but pulls are refused.
tenant_id = ${NICKEL_TENANT_ID}
; Largest single payload the ingest bridge accepts, in bytes. Default 104857600 (100 MB).
max_file_bytes = ${NICKEL_MAX_FILE_BYTES}

[STORAGE]
; Root of the development File Store, the raw_data outbox, the receipts and the job records
; (src/db/layout.py). Default .data; the image sets /data.
data_dir = ${NICKEL_DATA_DIR}
