[project]
name = "nickel-connection"
version = "0.1.0"
description = "Nickel connection layer (Layer 1): connectors that fetch or receive raw source data, keep every original, and publish an envelope for the Transform layer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.uv]
# A service, not a library: the image copies app/ and runs it, nothing is built or published.
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
# Relative paths in coverage.xml, so SonarQube can match them when it scans in Docker or CI.
relative_files = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
src_paths = ["app", "tests"]

[tool.bandit]
# Team standard skips (Rockwell setup):
# B101: assert_used          — pytest test files use assert by design
# B105/B106: hardcoded_password — false positives on URL paths, empty strings, test tokens
# B110: try_except_pass      — intentional best-effort cleanup (disconnects, socket closes)
# B311: random               — used for scheduling jitter only, never for cryptography
# B404: import_subprocess    — subprocess is required for build tooling
# B603: subprocess_without_shell_equals_true — shell=False (default) is the safer choice
# B607: start_process_with_partial_path — standard system tools resolved via PATH
skips = ["B101", "B105", "B106", "B110", "B311", "B404", "B603", "B607"]
