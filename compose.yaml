# Run the service locally:
#   cp .env.example .env          # then set NICKEL_SERVICE_TOKEN (NICKEL_TENANT_ID is set); .env is git-ignored
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl -H "Authorization: Bearer $NICKEL_SERVICE_TOKEN" http://localhost:8000/jobs
# One-off commands in the same image and data volume (docs/docker.md):
#   docker compose run --rm nickel-connection python -m src.cli documents pull manifests/documents/<id>.yaml
#   docker compose run --rm nickel-connection python -m src.cli documents status
# The S3 File Store on SeaweedFS (docs/docker.md, "The S3 File Store"), off by default: set
# NICKEL_FILE_STORE=s3, COMPOSE_PROFILES=s3 and NICKEL_S3_SECRET_ACCESS_KEY in .env, then as above.
services:
  nickel-connection:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        # The local image can pull the Kaggle and Hugging Face manifests (docs/docker.md); the
        # production image is built without.
        DEV_SOURCES: "1"
    image: nickel-connection:dev
    env_file:
      - path: .env
        required: false
    environment:
      # A local run: the API docs on unless .env or the shell says otherwise (the service itself
      # defaults to production, with the docs off).
      NICKEL_ENV: ${NICKEL_ENV:-development}
      # The tenant everything is ingested for (a UUID): required, from .env or the shell.
      NICKEL_TENANT_ID: ${NICKEL_TENANT_ID:?set NICKEL_TENANT_ID (a UUID) in .env}
      # The service token callers must present: required, from .env or the shell (.env.example says how
      # to generate one). The service does not start without it.
      NICKEL_SERVICE_TOKEN: ${NICKEL_SERVICE_TOKEN:?set NICKEL_SERVICE_TOKEN in .env (see .env.example)}
      # Optional source credentials, passed through from your shell and ignored when empty:
      # KAGGLE_API_TOKEN for Kaggle manifests, HF_TOKEN for higher Hugging Face rate limits.
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # The File Store: local disk (the connector-data volume) unless .env says s3; then the
      # originals go to the seaweedfs service below, with the credentials .env gives both.
      NICKEL_FILE_STORE: ${NICKEL_FILE_STORE:-local}
      NICKEL_S3_ENDPOINT_URL: http://seaweedfs:8333
      NICKEL_S3_REGION: ${NICKEL_S3_REGION:-us-east-1}
      NICKEL_S3_ORIGINALS_BUCKET: ${NICKEL_S3_ORIGINALS_BUCKET:-originals}
      NICKEL_S3_ACCESS_KEY_ID: ${NICKEL_S3_ACCESS_KEY_ID:-nickel-connection}
      NICKEL_S3_SECRET_ACCESS_KEY: ${NICKEL_S3_SECRET_ACCESS_KEY:-}
    depends_on:
      # With the s3 profile on, the service starts once the bucket is there; without it, there is
      # nothing to wait for.
      seaweedfs-init:
        condition: service_completed_successfully
        required: false
    ports:
      # This machine only; change the host part to share it on the network.
      - "127.0.0.1:${NICKEL_PORT:-8000}:8000"
    volumes:
      # Files, receipts, the raw_data outbox, job records and download caches: /data in the
      # container. `docker compose down -v` deletes it.
      - connector-data:/data
    # Hardening: read-only root filesystem (the service writes only to /data and /tmp), no Linux
    # capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # SeaweedFS's S3 API, the File Store in development (the s3 profile). Pinned by digest: a tag
  # that moves could change what the S3 client meets.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: [s3]
    # The image's own entrypoint, once the secret is known to be set (an identity with an empty
    # secret would take a request signed with one), with a JWT key made at each start that no one
    # outside the container knows: SeaweedFS's IAM gRPC, which listens with the S3 API (18333),
    # then takes no call without a token signed with it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$NICKEL_S3_SECRET_ACCESS_KEY" ]; then
          echo "seaweedfs: set NICKEL_S3_SECRET_ACCESS_KEY in .env (.env.example says how)" >&2
          exit 1
        fi
        WEED_JWT_FILER_SIGNING_KEY="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        export WEED_JWT_FILER_SIGNING_KEY
        exec /entrypoint.sh "$$@"
      - /entrypoint.sh
    # The master, volume server and filer take no credentials, so they listen on the container's
    # loopback only (-ip, -ip.bind); only the S3 API, which checks its identities, is on the network.
    # No Iceberg or Lance listener, and no telemetry out of the box.
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.telemetry=false
      - -s3
      - -s3.port=8333
      - -s3.ip.bind=0.0.0.0
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      NICKEL_S3_SECRET_ACCESS_KEY: ${NICKEL_S3_SECRET_ACCESS_KEY:-}
    configs:
      - source: seaweedfs-identities
        target: /etc/seaweedfs/s3.json
    ports:
      # This machine only: `uv run` outside Docker reaches it at http://127.0.0.1:8333.
      - "127.0.0.1:${NICKEL_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
    security_opt:
      - no-new-privileges:true

  # One-shot: the originals bucket, owned by the service's identity (which then needs no admin
  # rights), made through SeaweedFS's own shell, from inside seaweedfs's network namespace: its
  # master is on loopback. Running it again changes nothing.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: [s3]
    depends_on:
      seaweedfs:
        condition: service_healthy
    network_mode: service:seaweedfs
    environment:
      SHELL_MASTER: 127.0.0.1:9333
    command:
      - shell
      - s3.bucket.create -name ${NICKEL_S3_ORIGINALS_BUCKET:-originals} -owner nickel-connection
    security_opt:
      - no-new-privileges:true

configs:
  # SeaweedFS's S3 identities, written by compose from .env: the secret is never committed. The
  # service's identity may read and write the originals bucket, and nothing else.
  seaweedfs-identities:
    content: |
      {
        "identities": [
          {
            "name": "nickel-connection",
            "credentials": [
              {
                "accessKey": "${NICKEL_S3_ACCESS_KEY_ID:-nickel-connection}",
                "secretKey": "${NICKEL_S3_SECRET_ACCESS_KEY:-}"
              }
            ],
            "actions": [
              "Read:${NICKEL_S3_ORIGINALS_BUCKET:-originals}",
              "Write:${NICKEL_S3_ORIGINALS_BUCKET:-originals}"
            ]
          }
        ]
      }

volumes:
  connector-data:
  seaweedfs-data:
