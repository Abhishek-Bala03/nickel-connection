# Stands in for the Oura v2 and Dexcom v3 APIs in the Nango demo (docs/demo-nango-wearables.md).
# Each patient's synthetic fixture sits under data/<vendor>/<patient>/<stream>.json; Nango's proxy
# reaches it at <base>/<vendor>/<patient> + the vendor's real path.
# ponytail: date and pagination parameters are ignored — every pull returns the whole fixture.
server {
    listen 8080;
    root /data;
    default_type application/json;

    location ~ ^/oura/([0-9]+)/v2/usercollection/([a-z0-9_]+)$ {
        try_files /oura/$1/$2.json =404;
    }
    location ~ ^/dexcom/([0-9]+)/v3/users/self/(egvs|devices|dataRange)$ {
        try_files /dexcom/$1/$2.json =404;
    }
    location / {
        return 404;
    }
}
